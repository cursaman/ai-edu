name: Import AutoSites education source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-autosites.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/cursaman/autosites.git "$RUNNER_TEMP/autosites"
          git -C "$RUNNER_TEMP/autosites" archive 46ec93ed741197396416302e402ef20b81e4dc7c | tar -xf -
          rm -f .github/workflows/import-autosites.yml .github/workflows/verify.yml deployment-target.json
          rm -rf .github/workflows
          node --input-type=module -e 'import fs from "node:fs"; const path = "package.json"; const pkg = JSON.parse(fs.readFileSync(path)); pkg.name = "ai-edu"; delete pkg.scripts["deployment:status"]; delete pkg.scripts.acceptance; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")'
          rm -f scripts/deployment-status.mjs scripts/final-acceptance.mjs AGENTS.md CODEX_WORKFLOW.md
          cat > README.md <<'EOF'
          # ai-edu

          AutoSites 기반 AI 홈페이지 제작 교육 사이트입니다. 1일 체험, 4주 과정, 작업환경 준비 안내와 무료 실습자료를 제공합니다.

          ```sh
          pnpm install --frozen-lockfile
          pnpm dev
          ```

          공개 페이지와 빌드는 `pnpm verify`로 확인합니다. 인증 실습에 필요한 환경변수는 `.env.example`을 참고하세요.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AutoSites education website into ai-edu"
          git push origin HEAD:main
